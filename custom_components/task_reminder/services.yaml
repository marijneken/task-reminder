start:
  fields:
    type:
      required: true
      example: washer
      selector:
        text:
    title:
      selector:
        text:
    message:
      selector:
        text:
    due_in:
      selector:
        duration:
    due_at:
      selector:
        datetime:
remind:
  fields:
    title:
      required: true
      example: Egg timer
      selector:
        text:
    message:
      example: The eggs are done
      selector:
        text:
    due_in:
      example: "00:07:00"
      selector:
        duration:
    due_at:
      selector:
        datetime:
    time_critical:
      default: true
      selector:
        boolean:
    dismissable:
      default: false
      selector:
        boolean:
done:
  fields:
    task_id:
      selector:
        text:
    type:
      selector:
        text:
snooze:
  fields:
    task_id:
      selector:
        text:
    type:
      selector:
        text:
dismiss:
  fields:
    task_id:
      selector:
        text:
    type:
      selector:
        text:
silence:
  fields:
    mode:
      required: true
      selector:
        select:
          translation_key: silence_mode
          options:
            - "off"
            - no_critical
            - silent
    until:
      selector:
        datetime:
